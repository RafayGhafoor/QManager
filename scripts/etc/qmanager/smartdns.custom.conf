########################################
# SmartDNS tuning - adapted from the greenpacket O5A config
#
# SOURCE: greenpacket-o5a-qmanager/deploy/smartdns.conf (366 lines, written for
# smartdns-rs 0.13.1 on an RM520N). This file keeps what that config actually
# decided and drops what THIS build cannot parse.
#
# INCLUDED, NOT SUBSTITUTED. QManager generates the base config from UCI (bind,
# cache-size, the upstream pool, prefetch) and appends `conf-file` pointing here.
# So `bind` and `cache-size` are deliberately ABSENT: the base owns them, and a
# second bind line would either be ignored or fight the base.
#
# KEPT (measured useful on the reference unit):
#   cache-file        persist the cache across restarts AND reboots (/usrdata)
#   tcp-idle-time 600 keep upstream TCP+TLS connections warm. The reference
#                     measured the first post-idle lookup at 704 ms with 120 s
#                     and 43 ms with 600 s (www.docker.com). Behind carrier NAT,
#                     do not raise much past 600 - a connection the operator's
#                     NAT has forgotten costs a full client-side timeout.
#   rr-ttl-min 600    floor for cached TTLs; matches tcp-idle-time so an entry
#                     and the connection that produced it age out together.
#   serve-expired     answer from an expired entry instead of waiting upstream;
#                     the reply carries a 30 s TTL so clients re-ask soon.
#   force-AAAA-SOA    this device has NO IPv6 data path (no global address, no
#                     default route). Without it every AAAA query is still raced
#                     upstream and IPv6-preferring clients stall before falling
#                     back to A. The C build answers SOA locally.
#   speed-check-mode  measure candidate IPs before answering, and prefer TCP
#                     when ICMP is deprioritised on the carrier (common here).
#   log-level warn    + a size-capped log; the default info level is noise.
#   blocklist         the reference's `address /domain/#` entries (returns NXDOMAIN
#                     locally instead of asking upstream).
#
# DROPPED, and why:
#   cache-persist yes        smartdns-rs only; this build has no such directive.
#   -bootstrap-dns /         smartdns-rs GROUP syntax. The C build's `server`
#     -exclude-default-group  takes no such flags; a bare URL is correct here.
#   domain-rules ... -speed-check-mode  per-domain rules are an rs feature; the
#                            global speed-check-mode below covers the same ground.
#   the reference's provider list is already the default UCI pool; `server`
#   lines below are ADDITIONS the pool does not carry.
########################################

# The cache lives on /usrdata (the overlay), NOT /tmp, so it survives a REBOOT.
# Measured: rs writes this file only on a clean exit (0 bytes while running, 134 B
# after a stop), so the flash cost is one write per service stop - not per query.
# cap: 4096 entries at the reference build's ~125 B/entry is ~500 KB on a 32 MB
# overlay; if that ever grows, lower cache-size before moving it back to tmpfs.
# The directory is owned by uid 65534: the daemon is NOT root (procd runs it as
# nobody), so a root-owned path fails to save with EACCES.
# cache-persist: write the cache on exit and LOAD it on start. Without it the
# file is created but always 0 bytes (measured), so every restart/reboot came back
# cold and the first lookup of a known name paid a full DoH round trip again.
# Dropped earlier only because the C build lacked the directive - we are on
# smartdns-rs now (change 49).
cache-file /usrdata/qmanager/smartdns/cache
cache-persist yes
tcp-idle-time 600
rr-ttl-min 600

serve-expired yes
serve-expired-ttl 3600
serve-expired-reply-ttl 30

force-AAAA-SOA yes

speed-check-mode ping,tcp:80

log-level warn
log-file /tmp/smartdns.log
log-size 128k
log-num 2

# Extra DoH providers the reference ran that our default pool does not.
# REMOVED in change 54: doh.opendns.com (timed out ~every 3-6 min, and kept doing
# so after a restart) and dns.nextdns.io (the bare anonymous endpoint, intermittent
# timeouts). They were the ONLY upstreams in the resolver's error log.
server https://1.1.1.1/dns-query
server https://unfiltered.adguard-dns.com/dns-query
server https://sky.rethinkdns.com/

# Reference blocklist (answer locally, never ask upstream).
address /aidcgroup.net/47.246.72.115
address /umlazada.alibaba.com/#
address /epss.alibaba-inc.com/#
address /guardsquare.com/#
address /guardsquare.io/#
address /guardsquare.net/#

# response-mode (change 56): answer a cold query with the first upstream reply
# instead of first probing the resolved IPs (the default, driven by
# speed-check-mode). A/B/A on two sets of 15 never-asked names: mean cold lookup
# ~262 -> ~217 ms (-17%), ordering held in every pair; median unchanged.
response-mode fastest-response
